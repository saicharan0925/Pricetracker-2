# Render Blueprint Specification for SmartPrice Tracker
# https://render.com/docs/blueprint-spec

version: "1"

services:
  # ===========================================================================
  # 1. FastAPI Backend Web Service
  # ===========================================================================
  - type: web
    name: smartprice-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./smartprice.db
      - key: JWT_SECRET
        generateValue: true
      - key: CHECK_INTERVAL_MINUTES
        value: "30"
      - key: FRONTEND_URL
        value: "*"
      # Email credentials (configure in Render Dashboard)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: SmartPrice <onboarding@resend.dev>
      - key: SMTP_SERVER
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FROM_EMAIL
        sync: false

  # ===========================================================================
  # 2. React Vite Frontend Static Site
  # ===========================================================================
  - type: static
    name: smartprice-frontend
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # Client-side SPA routing rewrite rule
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Point to your deployed backend URL + /api (e.g. https://smartprice-backend.onrender.com/api)
      - key: VITE_API_URL
        sync: false
